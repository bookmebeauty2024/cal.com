name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Zero Downtime Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 60m

          script: |

            echo "====================================="
            echo "🚀 STARTING ZERO-DOWNTIME DEPLOY"
            echo "====================================="

            cd /var/www

            #########################################
            # Detect Active Release
            #########################################

            CURRENT=$(readlink calcom-dev)

            echo "Current active release:"
            echo $CURRENT

            if [ "$CURRENT" = "/var/www/calcom-dev-blue" ]; then
              TARGET="calcom-dev-green"
            else
              TARGET="calcom-dev-blue"
            fi

            echo "-------------------------------------"
            echo "🎯 Deploy target: $TARGET"
            echo "-------------------------------------"

            cd /var/www/$TARGET

            #########################################
            # Cleanup Previous Build
            #########################################

            echo "🧹 Cleaning old build..."
            rm -rf apps/web/.next || true
            rm -rf node_modules/.cache || true
            rm -f apps/web/.next/lock || true

            #########################################
            # Kill Stale Processes (IMPORTANT)
            #########################################

            echo "🛑 Killing stale Next/Turbo processes..."
            pkill -f next || true
            pkill -f turbo || true

            #########################################
            # Pull Latest Code
            #########################################

            echo "⬇️ Pulling latest develop branch..."
            git fetch origin
            git reset --hard origin/develop

            #########################################
            # Yarn 4 Fix (VERY IMPORTANT)
            #########################################

            echo "⚙️ Enabling Corepack..."
            corepack enable
            corepack prepare yarn@4.12.0 --activate

            #########################################
            # Install Dependencies
            #########################################

            echo "📦 Installing dependencies..."
            yarn install --immutable

            #########################################
            # Build Applications
            #########################################

            echo "🏗 Building WEB..."
            script -q -c "yarn workspace @calcom/web build" /dev/null

            echo "🏗 Building API..."
            script -q -c "yarn workspace @calcom/api build" /dev/null

            echo "✅ Build completed"

            #########################################
            # Switch Live Release
            #########################################

            echo "-------------------------------------"
            echo "🔁 Switching live release..."
            echo "-------------------------------------"

            ln -sfn /var/www/$TARGET /var/www/calcom-dev

            #########################################
            # Reload PM2 (ZERO DOWNTIME)
            #########################################

            echo "♻️ Reloading PM2..."
            pm2 startOrReload ecosystem.config.js

            echo "💾 Saving PM2 state..."
            pm2 save

            echo "====================================="
            echo "✅ DEPLOY SUCCESSFUL"
            echo "====================================="