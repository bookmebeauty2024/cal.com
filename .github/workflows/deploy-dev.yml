name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Zero Downtime Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |

            echo "==============================="
            echo "🚀 STARTING ZERO-DOWNTIME DEPLOY"
            echo "==============================="

            cd /var/www

            CURRENT=$(readlink calcom-dev)

            echo "Current active release:"
            echo $CURRENT

            if [ "$CURRENT" = "/var/www/calcom-dev-blue" ]; then
              TARGET="calcom-dev-green"
            else
              TARGET="calcom-dev-blue"
            fi

            echo "--------------------------------"
            echo "🎯 Deploy target: $TARGET"
            echo "--------------------------------"

            cd /var/www/$TARGET

            echo "🧹 Cleaning old build..."
            rm -rf apps/web/.next
            rm -rf node_modules/.cache

            echo "⬇️ Pulling latest develop branch..."
            git fetch origin
            git reset --hard origin/develop

            echo "📦 Installing dependencies..."
            yarn install --immutable

            echo "🏗 Building WEB..."
            yarn workspace @calcom/web build

            echo "🏗 Building API..."
            yarn workspace @calcom/api build

            echo "✅ Build completed"

            echo "--------------------------------"
            echo "🔁 Switching live release..."
            echo "--------------------------------"

            ln -sfn /var/www/$TARGET /var/www/calcom-dev

            echo "♻️ Reloading PM2 (zero downtime)..."
            pm2 reload ecosystem.config.js

            echo "💾 Saving PM2 state..."
            pm2 save

            echo "==============================="
            echo "✅ DEPLOY SUCCESSFUL"
            echo "==============================="