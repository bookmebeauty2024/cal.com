name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Zero Downtime Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |

            echo "==============================="
            echo "🚀 STARTING ZERO-DOWNTIME DEPLOY"
            echo "==============================="

            cd /var/www

            CURRENT=$(readlink calcom-dev)

            echo "Current release: $CURRENT"

            if [ "$CURRENT" = "/var/www/calcom-dev-blue" ]; then
              TARGET="calcom-dev-green"
            else
              TARGET="calcom-dev-blue"
            fi

            echo "Deploying into: $TARGET"

            cd /var/www/$TARGET

            echo "✅ Enabling Corepack"
            corepack enable
            corepack prepare yarn@4.12.0 --activate

            echo "⬇️ Updating source"
            git fetch origin
            git reset --hard origin/develop

            echo "🧹 Cleaning build"
            rm -rf apps/web/.next
            rm -rf node_modules/.cache

            echo "📦 Installing deps"
            yarn install --immutable

            echo "🏗 Building WEB"
            yarn workspace @calcom/web build

            echo "🏗 Building API"
            yarn workspace @calcom/api build

            echo "🔁 Switching symlink"
            ln -sfn /var/www/$TARGET /var/www/calcom-dev

            echo "♻️ Reloading PM2 apps"
            pm2 reload calcom-web-dev
            pm2 reload calcom-api-dev

            echo "💾 Saving PM2"
            pm2 save

            echo "==============================="
            echo "✅ ZERO-DOWNTIME DEPLOY DONE"
            echo "==============================="